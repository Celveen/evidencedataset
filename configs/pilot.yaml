# Stage 0.1 — VisualPRM failure-mode diagnosis config.
# Run: python pilot/stage0_1_visualprm_diagnosis.py --config configs/pilot.yaml [--mock]

# Number of InfoSeek queries to diagnose (report uses 1000; mock has ~20).
n_queries: 1000

# Data
data:
  benchmark: infoseek
  data_dir: data/corpus/infoseek   # real mode: jsonl files live here
  seed: 0

# Retrieval (vanilla RAG)
retriever:
  type: bm25          # Stage 0.1 uses BM25 top-k
  top_k: 5

# Generation backend (configurable): mock | hf | api
generation:
  backend: mock
  # --- hf backend ---
  model: Qwen/Qwen2.5-VL-7B-Instruct
  # --- api backend ---
  provider: anthropic            # anthropic | openai (reads *_API_KEY env var)
  max_new_tokens: 32
  temperature: 0.0
  # --- mock backend knobs ---
  mock_accuracy: 0.6             # P(mock generator returns the gold answer)
  mock_seed: 0

# Frozen PRM scorer
prm:
  model_name: OpenGVLab/VisualPRM-8B
  device: null                   # null -> auto (cuda if available else cpu)
  # --- mock knobs ---
  mock_correlation: 0.2          # target Spearman(score, outcome) in mock mode
  mock_seed: 0

# Outcome correctness
outcome:
  metric: exact_match            # exact_match | f1

# Output
output:
  report_dir: data/pilot_reports

# Go/no-go thresholds (implementation report Stage 0.1)
thresholds:
  needs_finetune_below: 0.3      # Spearman < this -> hypothesis holds, continue
  already_good_above: 0.6        # Spearman > this -> STOP and reconsider
