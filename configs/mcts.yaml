# MCTS inference config (PRM-guided UCB1 search).
# Run: python scripts/run_inference.py --config configs/mcts.yaml [--mock]

n_queries: 20                  # queries to evaluate (mock caps at ~100)

search:
  rollouts: 10                 # P — rollout budget per query
  max_depth: 3
  top_k_children: 3            # children kept per expansion (PRM-ranked)
  c_uct: 1.0                   # UCB1 exploration constant
  early_stop_q: 2.0            # tau_stop；>1=禁用。未校准 PRM 的分数无概率意义，0.9 阈值会在
                               # 第 1 条 rollout 后就终止搜索（Yes-prob 饱和），树根本没机会展开。
                               # ET-PRM 完成 Stage 4.3 校准后再启用（如 0.9）。
  seed: 0

data:
  benchmark: infoseek
  data_dir: data/corpus/infoseek
  seed: 0

retriever:
  type: bm25                   # bm25 | dense (dense needs a built index)
  top_k: 5

generation:                    # proposer's answer-drafting backend
  backend: mock                # mock | hf | api
  model: Qwen/Qwen2.5-VL-7B-Instruct
  provider: anthropic
  max_new_tokens: 32
  temperature: 0.0
  mock_accuracy: 0.6
  mock_seed: 0

prm:                           # pluggable scorer (frozen VisualPRM until Stage 4)
  model_name: OpenGVLab/VisualPRM-8B
  device: null
  mock_correlation: 0.2
  mock_seed: 0

outcome:
  metric: exact_match

output:
  report_dir: data/inference_reports

# ---- 推理侧 policy VLM（与 DatasetConstruct step1 同构；mock 模式自动忽略）----
policy:
  backend: api                    # api | hf | mock；服务器上指向本地 vLLM 的 OpenAI 兼容端点
  provider: openai
  model: Qwen2.5-VL-7B-Instruct
  base_url: http://127.0.0.1:8000/v1
  api_key_env: DASHSCOPE_API_KEY  # 本地 vLLM 任意非空即可
  max_new_tokens: 256
  temperature: 0.7

# 启用图检索：在 retriever 块加 image_search: true（需 query 图 + 语料图两侧齐备，
# 并会用 retriever.clip_model / image_top_k）

action_gate:                      # 可选：按 benchmark 门控动作类型（GatedProposer）
  enabled: false
  mode: dataset
  max_actions: null
