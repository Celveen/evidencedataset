# MCTS inference config (PRM-guided UCB1 search).
# Run: python scripts/run_inference.py --config configs/mcts.yaml [--mock]

n_queries: 20                  # queries to evaluate (mock caps at ~100)

search:
  rollouts: 10                 # P — rollout budget per query
  max_depth: 3
  top_k_children: 3            # children kept per expansion (PRM-ranked)
  c_uct: 1.0                   # UCB1 exploration constant
  early_stop_q: 2.0            # tau_stop; > 1 disables it. An uncalibrated PRM's scores carry
                               # no probabilistic meaning, so a 0.9 threshold ends the search
                               # after the first rollout (saturated yes-probability) and the
                               # tree never expands. Re-enable (e.g. 0.9) once ET-PRM is
                               # calibrated.
  seed: 0

data:
  benchmark: infoseek
  data_dir: data/corpus/infoseek
  seed: 0

retriever:
  backend: unified             # unified | bm25 | hybrid — unified = ONE CLIP space,
                               # text+image units independently indexed, mixed top-k
                               # (mock runs auto-fall back to bm25: no model downloads)
  dedupe: entity               # entity | doc | none — dedupe before top-k truncation
  top_k: 5
  image_search: true           # query-image search over the SAME unified index
                               # (auto-disabled when queries carry no images, and in
                               # mock runs without injected encoders)

generation:                    # proposer's answer-drafting backend
  backend: mock                # mock | hf | api
  model: Qwen/Qwen2.5-VL-7B-Instruct
  provider: anthropic
  max_new_tokens: 32
  temperature: 0.0
  mock_accuracy: 0.6
  mock_seed: 0

prm:                           # pluggable scorer; set scorer: visualprm + model_name for
                               # the real (or fine-tuned) PRM, overlap for offline runs
  model_name: OpenGVLab/VisualPRM-8B
  device: null
  mock_correlation: 0.2
  mock_seed: 0

outcome:
  metric: exact_match

output:
  report_dir: data/inference_reports

# ---- Inference-side policy VLM (identical wiring to DatasetConstruct step 1;
# ignored in mock mode) ----
policy:
  backend: api                    # api | hf | mock; point base_url at a local vLLM
                                  # OpenAI-compatible endpoint when serving your own policy
  provider: openai
  model: Qwen2.5-VL-7B-Instruct
  base_url: http://127.0.0.1:8000/v1
  api_key_env: DASHSCOPE_API_KEY  # any non-empty value works for a local vLLM server
  max_new_tokens: 256
  temperature: 0.7

# Image retrieval runs over the unified CLIP space. A corpus without images is fine:
# querying text units with an image is legitimate cross-modal retrieval
# (tune with retriever.clip_model / retriever.image_top_k).

action_gate:                      # optional per-benchmark action-type gate (GatedProposer)
  enabled: false
  mode: dataset
  max_actions: null
