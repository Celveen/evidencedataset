# ETBench-Open construction config. All paths are relative to the repository root.
# See DatasetConstruct/README.md; offline smoke test:
#   python DatasetConstruct/run_pipeline.py --mock

benchmark: infoseek

data:
  data_dir: data/corpus/infoseek     # raw data (queries / corpus JSONL)
  n_queries: 100                     # pilot small first; full InfoSeek is ~15K
  seed: 0

mcts:                                # Step 1 rollout settings; same semantics as the
                                     # `search` block of configs/mcts.yaml
  rollouts: 10                       # P — at most ~10 trajectories per query
  max_depth: 3                       # actions per trajectory (the root is depth 0)
  top_k_children: 3                  # candidate actions kept per expansion
  early_stop_q: 2.0                  # > 1 disables early stopping: data generation wants
                                     # diverse trajectories, not quick exits
  seed: 0

policy:                              # Step 1 policy VLM (OpenAI-compatible API)
  backend: api                       # api | mock (mock = offline smoke, no API calls)
  provider: openai                   # `openai` covers every OpenAI-compatible endpoint
  model: qwen3-vl-flash              # weak policy
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  api_key_env: DASHSCOPE_API_KEY     # set in DatasetConstruct/.env
  max_new_tokens: 256                # action proposals are multi-line JSON; 128 truncates
  temperature: 0.7                   # > 0 so rollouts differ from each other
  mock_accuracy: 0.6                 # mock backend only
  mock_seed: 0

retriever:
  backend: unified                    # unified = one unit-level CLIP index shared by both
                                      # search actions | bm25 | hybrid
  dedupe: entity                      # entity | doc | none — applied before top-k truncation
  top_k: 5
  image_search: true                  # image-query retrieval over the same unified index
                                      # (auto-disabled when queries carry no images, and in
                                      # mock runs without injected encoders)
  clip_model: clip-ViT-B-32           # encoder backing the unified index

verifier:                            # Step 2 grounding verifier
  backend: clip                      # clip (real) | lexical (mock / offline)
  clip_model: clip-ViT-B-32
  text_cos_lo: 0.5
  text_cos_hi: 0.9
  image_cos_lo: 0.15
  image_cos_hi: 0.32
  alpha: 0.5                         # score = alpha * local + (1 - alpha) * outcome
  support:                           # answer steps: is the answer backed by the evidence?
    backend: api                     # api | lexical | off
    floor: 0.3                       # correct-but-unsupported ~0.3; correct-and-supported ~1
    unsupported_threshold: 0.3       # outcome >= 0.5 and support <= this -> unsupported_correct
    generation:
      backend: api
      provider: openai
      model: deepseek-v4-pro
      base_url: https://api.deepseek.com/v1
      api_key_env: DEEPSEEK_API_KEY
      max_new_tokens: 8
      temperature: 0.0
      timeout: 60
      extra_body:
        thinking: {type: disabled}
  generation:                        # used only when backend: api
    backend: api
    provider: openai                 # DeepSeek speaks the OpenAI-compatible protocol
    model: deepseek-v4-pro
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
    max_new_tokens: 8
    temperature: 0.0
    timeout: 120
    extra_body:                      # reasoning models must have thinking disabled here,
      thinking: {type: disabled}     # or thinking tokens exhaust the budget and content is empty

rationale:                           # Step 3 rationale generation with a strong LLM
  backend: api                       # api | mock (mock = template, smoke only)
  concurrency: 8                     # parallel requests
  generation:
    backend: api
    provider: openai
    model: deepseek-v4-pro
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
    max_new_tokens: 300
    temperature: 0.3
    timeout: 120
    extra_body:                      # disable thinking (see above)
      thinking: {type: disabled}
  max_attempts: 3                    # regeneration attempts when QC rejects a rationale

quality:                             # Step 4 quality filtering
  min_steps: 2                       # reject trajectories that are too short
  max_steps: 8                       # reject trajectories that are too long
  max_grounding_outcome_gap: 0.7     # drop as a noisy label when |local - outcome| exceeds this
  dedupe_within_query: true          # drop repeated action sequences within one query
  val_fraction: 0.05                 # split train/val by query (no query spans both)

action_gate:
  enabled: false                     # optional per-benchmark restriction of action types
  mode: heuristic
  max_actions: 3

prm:
  scorer: overlap                    # offline guidance signal for Step 1 rollouts
                                     # (this is NOT the dataset label)

output:                              # intermediate and final artifacts
  trajectories: data/trajectories/infoseek_trajectories.jsonl   # Step 1
  scored: data/trajectories/infoseek_scored.jsonl               # Step 2
  rationales: data/trajectories/infoseek_rationales.jsonl       # Step 3
  dataset_dir: data/etbench_open                                # Step 4 (train / val / stats)
                                     # mock runs prefix every output with `mock_`
