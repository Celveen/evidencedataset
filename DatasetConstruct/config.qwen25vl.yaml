# ETBench-Open with local Qwen2.5-VL-7B as the Step 1 policy.

benchmark: infoseek

data:
  data_dir: data/corpus/infoseek
  n_queries: 100
  seed: 0

mcts:
  rollouts: 10
  max_depth: 3
  top_k_children: 3
  early_stop_q: 2.0
  seed: 0

policy:
  freeze_action_queries: false
  backend: api
  provider: openai
  model: Qwen2.5-VL-7B-Instruct
  base_url: http://127.0.0.1:8000/v1
  api_key_env: LOCAL_QWEN_API_KEY
  max_new_tokens: 256
  temperature: 0.7

retriever:
  backend: unified          # unified | bm25 | hybrid — one unit-level CLIP index
  dedupe: entity            # entity | doc | none — dedupe before top-k truncation
  top_k: 5
  image_search: true
  clip_model: clip-ViT-B-32
  image:
    enabled: true
    model_name: clip-ViT-B-32
    device: cpu
    batch_size: 32
    top_k: 3
  ocr:
    enabled: false
    command: /home/wenke/SQJ/code/EvidenceTree/.tools/tesseract/bin/tesseract
    language: eng
    psm: 3
verifier:
  backend: clip
  clip_model: clip-ViT-B-32
  device: cpu
  text_cos_lo: 0.5
  text_cos_hi: 0.9
  image_cos_lo: 0.15
  image_cos_hi: 0.32
  alpha: 0.5
  support:
    backend: api
    floor: 0.3
    unsupported_threshold: 0.3
    generation:
      backend: api
      provider: openai
      model: deepseek-v4-pro
      base_url: https://api.deepseek.com/v1
      api_key_env: DEEPSEEK_API_KEY
      max_new_tokens: 8
      temperature: 0.0
      timeout: 60
      extra_body:
        thinking: {type: disabled}
  generation:
    backend: api
    provider: openai
    model: deepseek-v4-pro
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
    max_new_tokens: 8
    temperature: 0.0
    timeout: 120
    extra_body:
      thinking: {type: disabled}

rationale:
  backend: api
  concurrency: 8
  generation:
    backend: api
    provider: openai
    model: deepseek-v4-pro
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
    max_new_tokens: 300
    temperature: 0.3
    timeout: 120
    extra_body:
      thinking: {type: disabled}
  max_attempts: 3

quality:
  min_steps: 2
  max_steps: 8
  max_grounding_outcome_gap: 0.7
  dedupe_within_query: true
  val_fraction: 0.05

action_gate:
  enabled: false
  mode: heuristic
  max_actions: 3

prm:
  scorer: overlap           # offline guidance for Step 1 rollouts (not the label)

output:
  trajectories: data/trajectories/infoseek_qwen25vl7b_trajectories.jsonl
  scored: data/trajectories/infoseek_qwen25vl7b_scored.jsonl
  rationales: data/trajectories/infoseek_qwen25vl7b_rationales.jsonl
  dataset_dir: data/etbench_open/qwen25vl7b
