# DeepSeek, OpenAI protocol (the default in base.yaml; reachable from the construction server).
# Key: DEEPSEEK_API_KEY=... in DatasetConstruct/.env
provider: openai
base_url: https://api.deepseek.com/v1
model: deepseek-v4-pro
api_key_env: DEEPSEEK_API_KEY
extra_body:
  thinking: {type: disabled}   # DeepSeek-specific: keep thinking tokens out of the budget
