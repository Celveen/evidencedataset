# Our own local rationale / judge server (serve_rationale_vllm.sh) running the
# general-purpose Qwen3-30B-A3B-Instruct-2507 (non-thinking) instead of the Coder:
#   MODEL_DIR=models/Qwen3-30B-A3B-Instruct-2507 NAME=qwen3-30b-a3b-instruct \
#       bash DatasetConstruct/serve_rationale_vllm.sh
# Download: data_prep/download_assets.sh judge. The key must match the server's
# --api-key. Key: LOCAL_QWEN_API_KEY=local in DatasetConstruct/.env
provider: openai
base_url: http://127.0.0.1:8020/v1
model: qwen3-30b-a3b-instruct
api_key_env: LOCAL_QWEN_API_KEY
max_new_tokens: 900
timeout: 180
